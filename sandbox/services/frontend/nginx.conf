# Serves the built app and proxies its API calls to the services on the same origin, paths unchanged, so the
# services need no CORS and the browser's traceparent and baggage headers reach them untouched.
# nginx is not instrumented and is not a component of the stack: the recorded hop is frontend -> service.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Unknown paths (a reload of /order, /orders/42) get the app.
    location / {
        try_files $uri /index.html;
    }

    # /orders/42 answers with the app to a page load and with JSON to the app's fetch, so the browser's HTTP cache
    # must key it by the Accept header (it would hand the cached page to the fetch otherwise): see location /orders.
    location = /index.html {
        add_header Vary Accept always;
    }

    location = /stock {
        proxy_pass http://inventory-service:8081;
    }

    location /orders {
        # A page load of /orders/42 (a browser reload) accepts text/html and gets the app; the app's own fetches
        # ask for JSON and reach orders-service.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        add_header Vary Accept always;
        proxy_pass http://orders-service:8080;
    }
}
