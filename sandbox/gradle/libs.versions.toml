[versions]
# Same versions as tool/gradle/libs.versions.toml, so the sandbox runs what the tool was built and tested against.
kotlin = "2.4.21"
spring-boot = "4.1.2"
jackson = "3.2.4"
junit = "6.1.3"
kotest = "6.2.6"
rest-assured = "6.3.0"
# Must equal opentelemetry-javaagent in tool/gradle/libs.versions.toml: the stack extension is built against that
# agent and uses its internal (non-public, unstable) APIs, so it only works inside the same agent version.
opentelemetry-javaagent = "2.33.1"
# The version the Spring Boot 4.1.2 BOM manages; pinned here because e2e-tests is not a Spring Boot project.
testcontainers = "2.0.5"
slf4j = "2.0.20"
# The tool, consumed from mavenLocal (`tool/gradlew -p tool publishToMavenLocal`).
stack-tool = "0.1.0-SNAPSHOT"

[libraries]
# The tool
stack-agent-extension = { module = "io.stackvibed:stack-agent-extension", version.ref = "stack-tool" }
stack-test-harness = { module = "io.stackvibed:stack-test-harness", version.ref = "stack-tool" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-javaagent" }

# orders-service (versions managed by the Spring Boot BOM)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# e2e-tests
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
# Shows Testcontainers / docker compose output in acceptance test logs.
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
