# The step-1 sandbox stack: orders-service (under the OpenTelemetry agent with the stack extension), its Postgres
# database, and the stack reporter that writes what the agent exports into ./recordings.
#
# Before `docker compose up -d --build` (see README.md):
#   tool/gradlew -p tool publishToMavenLocal :reporter:dockerImage
#   sandbox/gradlew -p sandbox stackAgent assemble
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      # For orders-service run from the IDE (application.yaml). Not 5432, so a Postgres installed on the host
      # (which usually owns localhost:5432) cannot shadow it.
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 5s
      retries: 30

  reporter:
    image: stackvibed/reporter:0.1.0-SNAPSHOT
    # Built locally by `tool/gradlew -p tool :reporter:dockerImage`; it is not on any registry.
    pull_policy: never
    ports:
      - "4318:4318"
    volumes:
      - ./recordings:/recordings

  orders-service:
    build: ./services/orders-service
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/stack-agent/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/stack-agent/stack-agent-extension.jar
      OTEL_SERVICE_NAME: orders-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://reporter:4318
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
    volumes:
      # Filled by `sandbox/gradlew -p sandbox stackAgent`.
      - ./build/stack-agent:/stack-agent:ro
    depends_on:
      postgres:
        condition: service_healthy
      reporter:
        condition: service_started
