# The sandbox stack: orders-service, inventory-service and shipping-service (all under the OpenTelemetry agent with the
# stack extension), their Postgres databases, a single-node Kafka broker, the stack reporter that writes what the agent
# exports into ./recordings, and the frontend (a React app served by nginx, which proxies its API calls to the two
# HTTP services it uses).
# orders-service reserves stock at inventory-service (HTTP) before it stores an order, then publishes it to the
# `order-placed` topic; shipping-service consumes that topic and stores a pending shipment.
#
# Before `docker compose up -d --build --wait` (see README.md):
#   tool/gradlew -p tool publishToMavenLocal :reporter:dockerImage
#   sandbox/gradlew -p sandbox stackAgent assemble
# `assemble` also builds the frontend into services/frontend/dist, which its image copies.
# On Podman, add docker-compose.podman.yml (see README.md, "With Podman").
#
# Ports are published on 127.0.0.1 only: recorded traffic is not redacted, and nothing here needs to be reachable
# from other machines.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      # For orders-service run from the IDE (application.yaml). Not 5432, so a Postgres installed on the host
      # (which usually owns localhost:5432) cannot shadow it.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 5s
      retries: 30

  inventory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      # For inventory-service run from the IDE (application.yaml); 15433 for the same reason as 15432 above.
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 30

  shipping-db:
    image: postgres:17
    environment:
      POSTGRES_DB: shipping
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
    ports:
      # For shipping-service run from the IDE (application.yaml); 15434 for the same reason as 15432 above.
      - "127.0.0.1:15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    # One KRaft node that is both broker and controller. Two listeners for the broker: PLAINTEXT (29092) is what the
    # other containers use (kafka:29092), HOST (9092) what the host uses (localhost:9092, for a service run from the IDE).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single broker: the internal topics cannot be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30

  reporter:
    image: stackvibed/reporter:0.1.0-SNAPSHOT
    # Built locally by `tool/gradlew -p tool :reporter:dockerImage`; it is not on any registry.
    pull_policy: never
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./recordings:/recordings

  orders-service:
    build: ./services/orders-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/stack-agent/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/stack-agent/stack-agent-extension.jar
        -Dstack.methods.packages=io.stackvibed.sandbox.orders
      OTEL_SERVICE_NAME: orders-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://reporter:4318
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      INVENTORY_BASE_URL: http://inventory-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      # Filled by `sandbox/gradlew -p sandbox stackAgent`.
      - ./build/stack-agent:/stack-agent:ro
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      reporter:
        condition: service_started
    # `docker compose up --wait` returns once this passes, so the e2e tests never race the service's startup.
    # The JRE image has neither curl nor wget, so bash asks the actuator itself. Each probe is a traced request
    # (it lands in recordings/_unassigned), hence frequent probes only while starting and rare ones after that.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /actuator/health HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"status":"UP"'' <&3'
      interval: 60s
      timeout: 5s
      start_period: 120s
      start_interval: 1s

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/stack-agent/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/stack-agent/stack-agent-extension.jar
        -Dstack.methods.packages=io.stackvibed.sandbox.inventory
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://reporter:4318
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
    volumes:
      - ./build/stack-agent:/stack-agent:ro
    depends_on:
      inventory-db:
        condition: service_healthy
      reporter:
        condition: service_started
    # Same probe as orders-service, on 8081.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf ''GET /actuator/health HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"status":"UP"'' <&3'
      interval: 60s
      timeout: 5s
      start_period: 120s
      start_interval: 1s

  shipping-service:
    build: ./services/shipping-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/stack-agent/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/stack-agent/stack-agent-extension.jar
        -Dstack.methods.packages=io.stackvibed.sandbox.shipping
      OTEL_SERVICE_NAME: shipping-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://reporter:4318
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipping-db:5432/shipping
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./build/stack-agent:/stack-agent:ro
    depends_on:
      shipping-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      reporter:
        condition: service_started
    # Same probe as orders-service, on 8082.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf ''GET /actuator/health HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"status":"UP"'' <&3'
      interval: 60s
      timeout: 5s
      start_period: 120s
      start_interval: 1s

  frontend:
    build: ./services/frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      orders-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    # Static, so not a traced request. `docker compose up --wait` returns once nginx serves the app.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30
