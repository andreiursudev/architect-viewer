# The sandbox stack: orders-service and inventory-service (both under the OpenTelemetry agent with the stack
# extension), their Postgres databases, and the stack reporter that writes what the agent exports into ./recordings.
# orders-service reserves stock at inventory-service (HTTP) before it stores an order.
#
# Before `docker compose up -d --build --wait` (see README.md):
#   tool/gradlew -p tool publishToMavenLocal :reporter:dockerImage
#   sandbox/gradlew -p sandbox stackAgent assemble
#
# Ports are published on 127.0.0.1 only: recorded traffic is not redacted, and nothing here needs to be reachable
# from other machines.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      # For orders-service run from the IDE (application.yaml). Not 5432, so a Postgres installed on the host
      # (which usually owns localhost:5432) cannot shadow it.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 5s
      retries: 30

  inventory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      # For inventory-service run from the IDE (application.yaml); 15433 for the same reason as 15432 above.
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 30

  reporter:
    image: stackvibed/reporter:0.1.0-SNAPSHOT
    # Built locally by `tool/gradlew -p tool :reporter:dockerImage`; it is not on any registry.
    pull_policy: never
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./recordings:/recordings

  orders-service:
    build: ./services/orders-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/stack-agent/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/stack-agent/stack-agent-extension.jar
      OTEL_SERVICE_NAME: orders-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://reporter:4318
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      INVENTORY_BASE_URL: http://inventory-service:8081
    volumes:
      # Filled by `sandbox/gradlew -p sandbox stackAgent`.
      - ./build/stack-agent:/stack-agent:ro
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      reporter:
        condition: service_started
    # `docker compose up --wait` returns once this passes, so the e2e tests never race the service's startup.
    # The JRE image has neither curl nor wget, so bash asks the actuator itself. Each probe is a traced request
    # (it lands in recordings/_unassigned), hence frequent probes only while starting and rare ones after that.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /actuator/health HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"status":"UP"'' <&3'
      interval: 60s
      timeout: 5s
      start_period: 120s
      start_interval: 1s

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/stack-agent/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/stack-agent/stack-agent-extension.jar
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://reporter:4318
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
    volumes:
      - ./build/stack-agent:/stack-agent:ro
    depends_on:
      inventory-db:
        condition: service_healthy
      reporter:
        condition: service_started
    # Same probe as orders-service, on 8081.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf ''GET /actuator/health HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"status":"UP"'' <&3'
      interval: 60s
      timeout: 5s
      start_period: 120s
      start_interval: 1s
