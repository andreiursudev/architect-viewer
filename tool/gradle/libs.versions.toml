[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
jackson = "3.2.4"
jackson-annotations = "2.22"
junit = "6.1.3"
kotest = "6.2.6"
mockk = "1.14.11"
victools = "5.0.0"
slf4j = "2.0.20"

[libraries]
# Build-logic plugin artifacts
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

# Jackson 3: databind lives in tools.jackson, annotations stay in com.fasterxml.jackson.core
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# JSON schema generation
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
victools-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "victools" }
victools-module-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "victools" }

[plugins]
