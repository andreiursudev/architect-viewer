[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
jackson = "3.2.4"
jackson-annotations = "2.22"
junit = "6.1.3"
kotest = "6.2.6"
mockk = "1.14.11"
victools = "5.0.0"
slf4j = "2.0.20"
shadow = "9.6.1"
# OpenTelemetry Java agent and the extension API that matches it
opentelemetry-javaagent = "2.33.1"
opentelemetry-instrumentation-alpha = "2.33.1-alpha"
opentelemetry-proto = "1.11.1-alpha"
# compileOnly: the agent provides ByteBuddy at runtime; pinned to the version opentelemetry-javaagent 2.33.1 bundles
bytebuddy = "1.18.14"
jakarta-servlet = "6.1.0"
rest-assured = "6.3.0"

[libraries]
# Build-logic plugin artifacts
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }

# Jackson 3: databind lives in tools.jackson, annotations stay in com.fasterxml.jackson.core
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# JSON schema generation
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
victools-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "victools" }
victools-module-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "victools" }

# Agent extension (compileOnly: provided by the OpenTelemetry Java agent / the instrumented app at runtime)
opentelemetry-instrumentation-bom-alpha = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetry-instrumentation-alpha" }
opentelemetry-javaagent-extension-api = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api" }
opentelemetry-instrumentation-api = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-api" }
opentelemetry-sdk-extension-autoconfigure-spi = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi" }
bytebuddy = { module = "net.bytebuddy:byte-buddy-dep", version.ref = "bytebuddy" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-javaagent" }
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "opentelemetry-proto" }

# Spring Boot app modules (versions managed by the Spring Boot BOM)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
h2 = { module = "com.h2database:h2" }

# Test harness (RestAssured is compileOnly: the consuming e2e build brings its own)
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }

[plugins]
